[package]
name = "corescope"
version = "0.6.1"
edition = "2021"
description = "Windows desktop monitor for CPU affinity, process memory, and hardware telemetry"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
getrandom = "0.3"
libloading = "0.8"
windows-sys = { version = "0.61", features = ["Win32_System_RemoteDesktop", "Win32_System_Diagnostics_Etw", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Performance", "Win32_System_Time", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_Security", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell"] }

[profile.release]
lto = "thin"
strip = true

